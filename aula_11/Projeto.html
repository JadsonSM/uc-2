<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Link para google fonts Rubik -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <!-- Link para o Bootstrap 5.3.0 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <!-- Css interno -->
    <link rel="stylesheet" href="./assets/css/style.css" />
    <!-- Icnones do do bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <title>Formulário de cadastro</title>
  </head>
  <body>
    <header>
      <img
        src="./assets/img/image-topo.png"
        alt="Imagem do topo do site com a logo e as cores do senac"
      />
    </header>
    <main>
      <div class="form-cadastro">
        <form action="" method="get"></form>
        <h3>Formulário Senac</h3>
        <div class="uma-coluna">
          <label for="nome">Nome completo</label>
          <input
            type="text"
            name="nome"
            required
            placeholder="Nome completo sem abreviação"
          />
        </div>
        <div class="duas-colunas">
          <label for="cpf">CPF</label>
          <input type="text" name="cpf" required placeholder="000.000.000-00" />
          <label for="data-nascimento">Data de Nascimento</label>
          <input type="date" name="data-nascimento" />
        </div>
        <div class="duas-colunas">
          <label for="telefone">Contato telefônico (DDD)</label>
          <input
            type="tel"
            name="telefone"
            required
            placeholder="(00) 00000-0000"
          />
          <label for="email">E-mail</label>
          <input type="email" name="email" required />
        </div>
        <div class="duas-colunas">
          <label for="cep">CEP:</label>
          <input type="text" name="cep" required placeholder="00000-000" />
        </div>
        <label for="endereco">Endereço</label>
        <input type="text" name="endereco" />
        <div class="tres-colunas">
          <label for="numero">Número</label>
          <input type="text" name="numero" />
          <label for="complemento">Complemento</label>
          <input type="text" name="complemento" />
          <label for="bairro">Bairro</label>
          <input type="text" name="bairro" />
        </div>
        <div class="duas-colunas">
          <label for="cidade">Cidade</label>
          <input type="text" name="cidade" />
          <label for="estado">Estado</label>
          <input type="text" name="estado" />
        </div>
        <div class="tres-colunas">
          <label for="escolaridade">Escolaridade</label>
          <select name="escolaridade" required>
            <option value="select">Selecione</option>
            <option value="ensino-medio">Fundamental</option>
            <option value="graduacao">Ensino Médio</option>
            <option value="pos-graduacao">Ensino Superior</option>
          </select>
          <label for="genero">Gênero</label>
          <select name="genero" required>
            <option value="select">Selecione</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
          </select>
          <label for="raca">Raça/Cor</label>
          <select name="raca" required>
            <option value="select">Selecione</option>
            <option value="branca">Branca</option>
            <option value="preta">Preta</option>
            <option value="parda">Parda</option>
            <option value="amarela">Amarela</option>
          </select>
        </div>
        <button type="submit">Enviar</button>
      </div>
    </main>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
