<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Link para google fonts Rubik -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <!-- Link para o Bootstrap 5.3.0 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <!-- Css interno -->
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Icnones do do bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <h2>Formulário de cadastro</h2>
    <div class="form-cadastro">
      <form action="" method="get">
        <label for="nome">Nome completo</label><br />
        <input type="text" name="nome-completo" required /><br />
        <label for="senha">Senha</label><br />
        <input type="password" name="senha" minlength="8" required /><br />
        <label for="data-nascimento">Data de nascimento</label><br />
        <input type="date" name="data-nascimento" required /><br />
        <label for="descricao">Fale sobre você</label><br />
        <textarea name="descricao" cols="10" rows="5" required></textarea><br />
        <label for="telefone">Telefone</label><br />
        <input type="tel" name="telefone" required /><br />
        <label for="foto">Foto de perfil</label><br />
        <input
          type="file"
          name="foto"
          size="10mb"
          accept=".png"
          required
        /><br />
        <label for="email">E-mail</label><br />
        <input type="email" name="email" required /><br />
        <button type="submit">Enviar formulário</button>
      </form>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
